# ============================================================================
#  Nakładka PRODUKCYJNA (ETAP D) — uruchamiana na serwerze RAZEM z compose.yaml:
#
#    docker compose -f compose.yaml -f compose.prod.yaml \
#      --profile cluster --profile apps --profile errors up -d
#
#  Co zmienia względem lokalnego dev:
#    - obrazy z rejestru (GHCR), tag = SHA commita  -> serwer niczego nie buduje
#    - zero bind-mountów z repo                      -> na serwerze nie ma repo
#    - sekrety i klucze z .env (gen-env.sh)          -> nic stałego w plikach
#    - bez Vite, bez trybu debug, logi na stderr
#
#  `!reset` / `!override` (Compose >= 2.24): w nakładce listy i mapy domyślnie
#  się SCALAJĄ z compose.yaml — a my chcemy bind-mounty USUNĄĆ, nie dopisać.
#  !override = "zastąp całą wartość", !reset = "jakby jej nigdy nie było".
# ============================================================================

# --- GlitchTip (ETAP 11b): środowisko wspólne dla serwera i jednorazowego bootstrapu --
# W compose.yaml sekrety mają domyślne wartości deweloperskie (`:-glitchtip_dev_2026`).
# Na serwerze to byłaby dziura, więc tu nadpisujemy je wartościami z .env, a brak wartości
# daje PUSTĄ, nie deweloperską. Celowo nie `:?`: Compose interpoluje cały plik, także
# usługi z wyłączonych profili, więc `:?` zablokowałoby każdy deploy na serwerze ze starym
# .env (bez sekcji GlitchTipa). Odmowę dają guard.py (STRICT) i setup_db.py.
x-glitchtip-prod-env: &glitchtip-prod-env
  DATABASE_URL: postgresql://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD:-}@postgres:5432/${GLITCHTIP_DB:-glitchtip}
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
  # Adres widziany w przeglądarce przez tunel SSH (make vps-tunnel): localhost:28000 na
  # Macu -> 127.0.0.1:18000 na serwerze. Wygląda jak localhost, więc samą domeną guard.py
  # prod od dev nie odróżni: stąd GLITCHTIP_STRICT_SECRETS.
  GLITCHTIP_DOMAIN: http://localhost:28000
  GLITCHTIP_STRICT_SECRETS: "true"
  GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-}
  GLITCHTIP_ADMIN_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:-}
  GLITCHTIP_API_TOKEN: ${GLITCHTIP_API_TOKEN:-}
  GLITCHTIP_KEY_CATALOG: ${GLITCHTIP_KEY_CATALOG:-}
  GLITCHTIP_KEY_FRONTEND: ${GLITCHTIP_KEY_FRONTEND:-}
  GLITCHTIP_KEY_SEARCH: ${GLITCHTIP_KEY_SEARCH:-}

services:

  # --- Elasticsearch: obraz z pluginami + analysis/ + skrypty w środku -------
  es-init:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-elasticsearch:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    volumes: !override
      - es-certs:/certs
      - es-snapshots:/snapshots

  es01:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-elasticsearch:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    volumes: !override
      - es01-data:/usr/share/elasticsearch/data
      - es-snapshots:/snapshots
      - es-certs:/usr/share/elasticsearch/config/certs:ro

  es02:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-elasticsearch:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    volumes: !override
      - es02-data:/usr/share/elasticsearch/data
      - es-snapshots:/snapshots
      - es-certs:/usr/share/elasticsearch/config/certs:ro

  es03:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-elasticsearch:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    volumes: !override
      - es03-data:/usr/share/elasticsearch/data
      - es-snapshots:/snapshots
      - es-certs:/usr/share/elasticsearch/config/certs:ro

  es-setup:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-elasticsearch:${IMAGE_TAG:?ustaw IMAGE_TAG}
    volumes: !reset []

  kibana:
    environment:
      # W compose.yaml są stałe "…_local_…_key" — wygodne lokalnie, ale znane
      # każdemu, kto czyta repo. Na serwerze: losowe z gen-env.sh.
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_KEY:?}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVEDOBJECTS_KEY:?}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY:?}

  # --- dane ------------------------------------------------------------------
  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-postgres:${IMAGE_TAG:?ustaw IMAGE_TAG}
    volumes: !override
      - pg-data:/var/lib/postgresql

  rabbitmq:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-rabbitmq:${IMAGE_TAG:?ustaw IMAGE_TAG}
    environment:
      # Czyta je infra/rabbitmq/entrypoint.sh, żeby policzyć hash hasła przy
      # starcie (definitions.json z hashem nie może leżeć w publicznym obrazie).
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes: !override
      - rabbitmq-data:/var/lib/rabbitmq

  # --- aplikacje -------------------------------------------------------------
  catalog-app:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-catalog:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment:
      # SHA obrazu (nie `dev` z compose.yaml): release w GlitchTipie wskazuje wdrożony commit.
      SENTRY_RELEASE: ${IMAGE_TAG:?ustaw IMAGE_TAG}
      # ":80" = Caddy słucha zwykłego HTTP na każdej nazwie hosta. Bez domeny
      # nie ma komu wystawić certyfikatu, a ruch i tak idzie szyfrowanym
      # tunelem SSH (docs/08-PLAN-ETAP-D-VPS.md, Task 9).
      SERVER_NAME: ":80"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${CATALOG_APP_KEY:?}
      # Adres widziany w przeglądarce przez tunel SSH (make vps-tunnel):
      # localhost:28080 na Macu -> 127.0.0.1:8080 na serwerze. 28080, nie
      # 18080 — tamten zajmuje lokalny stack dev (przesunięte porty, igrit).
      APP_URL: http://localhost:28080
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      VITE_DEV_SERVER: !reset null
    volumes: !override
      - caddy-data:/data
      - caddy-config:/config
    # HEALTHCHECK z obrazu woła https://$SERVER_NAME — przy ":80" to nie ma
    # sensu. Tu: zwykłe HTTP na wbudowany endpoint liveness Laravela.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  outbox-publisher:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-catalog:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment:
      # SHA obrazu (nie `dev` z compose.yaml): release w GlitchTipie wskazuje wdrożony commit.
      SENTRY_RELEASE: ${IMAGE_TAG:?ustaw IMAGE_TAG}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${CATALOG_APP_KEY:?}
      LOG_CHANNEL: stderr
      # compose.yaml ustawia debug (ETAP 11, dev); w prod nadpisujemy, inaczej
      # VPS pisałby każdy SQL i ack na poziomie debug do json-file.
      LOG_LEVEL: info
    volumes: !reset []

  catalog-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-catalog:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment:
      # SHA obrazu (nie `dev` z compose.yaml): release w GlitchTipie wskazuje wdrożony commit.
      SENTRY_RELEASE: ${IMAGE_TAG:?ustaw IMAGE_TAG}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${CATALOG_APP_KEY:?}
      LOG_CHANNEL: stderr
      # compose.yaml ustawia debug (ETAP 11, dev); w prod nadpisujemy, inaczej
      # VPS pisałby każdy SQL i ack na poziomie debug do json-file.
      LOG_LEVEL: info
    volumes: !reset []

  # catalog-scheduler: nakładka nie zmienia go poza poziomem logów (dziedziczy
  # LOG_LEVEL=debug z compose.yaml). Obraz/wolumeny schedulera w prod to osobna
  # sprawa (RUNBOOK #044), tu tylko spójny poziom, gdyby kontener powstał.
  catalog-scheduler:
    environment:
      LOG_LEVEL: info

  search-consumer:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-search:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment:
      # SHA obrazu (nie `dev` z compose.yaml): release w GlitchTipie wskazuje wdrożony commit.
      SENTRY_RELEASE: ${IMAGE_TAG:?ustaw IMAGE_TAG}
      APP_ENV: prod
      APP_SECRET: ${SEARCH_APP_SECRET:?}
      MAILER_DSN: null://null
      DEFAULT_URI: http://localhost
    volumes: !reset []

  # --- GlitchTip (ETAP 11b, ADR-0009) ------------------------------------------
  # Obraz z CI (infra/glitchtip/Dockerfile): oficjalny GlitchTip + skrypty w środku, bo na
  # serwerze nie ma repo. Kolejność z compose.yaml: db-setup -> glitchtip -> setup.
  # UI tylko przez tunel SSH (127.0.0.1:${GLITCHTIP_PORT:-18000}, w tunelu 28000).
  # Maile o nowych issue: mailpit z compose.yaml (profil `errors`), też tylko przez tunel;
  # żadna poczta nie wychodzi z VPS.
  glitchtip-db-setup:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-glitchtip:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment:
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}

  glitchtip:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-glitchtip:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment: *glitchtip-prod-env

  glitchtip-setup:
    image: ${IMAGE_REGISTRY:-ghcr.io/dommmin}/elastic-glitchtip:${IMAGE_TAG:?ustaw IMAGE_TAG}
    build: !reset null
    environment: *glitchtip-prod-env

  # Vite (HMR) to narzędzie deweloperskie — w prod assety są w obrazie catalog.
  # Profil, którego nikt nie włącza = usługa nigdy nie startuje.
  # !override, bo listy z nakładki się SCALAJĄ: samo `[dev-only]` dawało
  # [apps, dev-only] — i Vite dalej startował z profilem `apps`.
  catalog-vite:
    profiles: !override [dev-only]
