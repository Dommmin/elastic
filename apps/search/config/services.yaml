# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Skalary poniżej nie dają się wywnioskować przez autowiring —
        # trzeba je jawnie zbindować z env.
        bind:
            $baseUrl: '%env(CATALOG_INTERNAL_BASE_URL)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\ElasticsearchClientFactory:
        arguments:
            $host: '%env(ELASTICSEARCH_HOST)%'
            $user: '%env(ELASTICSEARCH_USER)%'
            $password: '%env(ELASTICSEARCH_PASSWORD)%'

    # Klient ES jako usługa — powstaje wywołaniem fabryki, nie `new` wprost,
    # bo budowa klienta (auth, hosty) to logika, nie tylko wstrzykiwanie
    # zależności. Wszystko, co potrzebuje `Client` (autowiring po typie),
    # dostanie dokładnie ten sam, skonfigurowany obiekt.
    Elastic\Elasticsearch\Client:
        factory: ['@App\Service\ElasticsearchClientFactory', 'create']

    # Transporty AMQP: reject po przejęciu wiadomości przez retry /
    # failure_transport -> ack, żeby *.dlq łapała tylko trucizny (redelivery
    # po crashu, błędy dekodowania), a nie kopię KAŻDEJ nieudanej próby.
    # Dlaczego i kiedy nack zostaje nackiem — docblock klasy, RUNBOOK #027.
    app.messenger.transport.product_sync.ack_after_hand_off:
        class: App\Messenger\AckAfterHandOffTransport
        decorates: messenger.transport.product_sync
        arguments: ['@.inner']
    app.messenger.transport.analytics.ack_after_hand_off:
        class: App\Messenger\AckAfterHandOffTransport
        decorates: messenger.transport.analytics
        arguments: ['@.inner']
    app.messenger.transport.alerts.ack_after_hand_off:
        class: App\Messenger\AckAfterHandOffTransport
        decorates: messenger.transport.alerts
        arguments: ['@.inner']
