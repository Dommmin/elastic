monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # JSON na stderr: Filebeat zbiera logi kontenerów z docker logs.
            # Kanał `request` pomijamy na poziomie info: każdy scrape Prometheusa
            # i healthcheck loguje tam „Matched route" (ok. 85% dokumentów
            # logs-app-search) i zalewa indeks szumem. Błędy z tego kanału
            # (nieobsłużone wyjątki HTTP to error/critical na `request`) płyną
            # dalej osobnym handlerem poniżej, więc ich nie tracimy.
            stderr_json:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: ["!event", "!doctrine", "!request"]
            stderr_json_request_errors:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json
                channels: [request]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Jedyny handler logów aplikacji w prod (bez fingers_crossed — logi info+
            # mają płynąć ciągle, nie tylko przy błędzie, by Kibana łączyła ślady).
            # Wpisy niosą extra.trace_id.
            # Kanał `request` pomijamy na poziomie info: każdy scrape Prometheusa
            # i healthcheck loguje tam „Matched route" (ok. 85% dokumentów
            # logs-app-search) i zalewa indeks szumem. Błędy z tego kanału
            # (nieobsłużone wyjątki HTTP to error/critical na `request`) płyną
            # dalej osobnym handlerem poniżej, więc ich nie tracimy.
            stderr_json:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: ["!event", "!doctrine", "!deprecation", "!request"]
            stderr_json_request_errors:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json
                channels: [request]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
