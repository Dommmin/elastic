# ============================================================================
#  RabbitMQ — konfiguracja lokalna
#
#  Topologia (exchange'e, kolejki, bindingi) jest ZADEKLAROWANA W PLIKU,
#  nie klikana w panelu. Powód: konfiguracja wyklikana nie istnieje w repo,
#  nie da się jej zrecenzować i znika przy `make nuke`.
# ============================================================================

# Topologia jako kod — ładowana przy starcie node'a.
load_definitions = /etc/rabbitmq/definitions.json

# --- pamięć i dysk ---------------------------------------------------------
# Gdy broker przekroczy ten próg pamięci, WSTRZYMUJE producentów (flow control).
# To mechanizm ochronny, nie awaria — ale w monitoringu wygląda jak "zawieszenie
# publikacji". Warto wiedzieć, zanim zobaczysz to pierwszy raz.
vm_memory_high_watermark.relative = 0.6

# Poniżej tej wolnej przestrzeni broker też blokuje publikacje.
disk_free_limit.absolute = 1GB

# --- logi ------------------------------------------------------------------
log.console = true
log.console.level = info

# --- kolejki ---------------------------------------------------------------
# Domyślny typ kolejki dla deklaracji bez jawnego x-queue-type.
# Quorum (oparte na Raft) to dziś domyślny wybór produkcyjny: replikacja,
# przewidywalne zachowanie przy awarii, wbudowany limit dostarczeń.
default_queue_type = quorum
