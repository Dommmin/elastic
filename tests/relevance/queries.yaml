# Zestaw zapytań kontrolnych do `_rank_eval` (ETAP 7, Faza 5,
# docs/06-PLAN-WDROZENIA.md, część F, artefakt #4).
#
# `php artisan search:eval` (apps/catalog) czyta ten plik, buduje dla
# każdego zapytania TEN SAM query template co ProductSearchService::search()
# (App\Services\ProductSearchService::buildSearchQuery — jeden template dla
# wyników i dla oceny, żeby nie ocenić czegoś innego, niż faktycznie widzi
# użytkownik) i liczy nDCG@10 przez `_rank_eval`.
#
# `grade` to relevance rating 0-3 (0 pomijamy — po prostu nie wypisujemy
# dokumentu jako relevant): 3 = dokładnie ten produkt, o który pytano;
# 1 = trafny wynik szerszej kategorii/marki/synonimu.
#
# ŚWIADOME OGRANICZENIE (docs/RUNBOOK.md, dopisek ETAP 7 przy #017): 13 par
# zamiast docelowych ~50 z dokumentu planu — to fundament harnessu na
# ~1500-produktowym seedzie (Faza 1), nie ETAP 8 (skala). ID-ki dokumentów
# są przywiązane do `php artisan marketplace:seed` ze stałym seedem Fakera
# (42) — świeży `marketplace:seed --fresh` odtwarza te same dane.
#
# Dwa zapytania (`notebook`, `komórka`) testują SYNONIMY z
# infra/elasticsearch/analysis/synonyms.txt, nie samo dopasowanie tekstu —
# zweryfikowane ręcznie na żywym indeksie: `notebook` zwraca DOKŁADNIE ten
# sam zestaw dokumentów co `Laptop`, `komórka` — co `Smartfon`.

