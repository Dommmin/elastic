# Zestaw zapytań kontrolnych do `_rank_eval` (ETAP 7, Faza 5,
# docs/06-PLAN-WDROZENIA.md, część F, artefakt #4).
#
# `php artisan search:eval` (apps/catalog) czyta ten plik, buduje dla
# każdego zapytania TEN SAM query template co ProductSearchService::search()
# (App\Services\ProductSearchService::buildSearchQuery — jeden template dla
# wyników i dla oceny, żeby nie ocenić czegoś innego, niż faktycznie widzi
# użytkownik) i liczy nDCG@10 przez `_rank_eval`.
#
# `relevant` to REGUŁY, nie ręczna lista ID-ków (docs/RUNBOOK.md #096).
# `search:eval` rozwija je na ID-ki z bazy katalogu (App\Services\Search\
# RelevanceJudgments). Selektory — dokładnie jeden na regułę:
#   id            — konkretny produkt po ID,
#   name          — dokładna nazwa produktu,
#   name_contains — fragment nazwy (bez rozróżniania wielkości liter),
#   brand         — nazwa marki,
#   category      — nazwa kategorii liścia (marketplace:seed, TAXONOMY).
# Dokument pasujący do kilku reguł dostaje najwyższą ocenę. Reguła, która
# nie łapie żadnego produktu, przerywa ewaluację (literówka / zły seed).
#
# `grade` 0-3: 3 = dokładnie ten produkt, o który pytano; 2 = dokładnie
# ten typ produktu; 1 = trafny wynik szerszej kategorii/marki/synonimu.
#
# DLACZEGO REGUŁY: zapytania kategorii i synonimów dają dziesiątkom
# dokumentów IDENTYCZNY `_score` (np. 53 smartfony po 8.8425 na seedzie
# 1500), a remis rozstrzyga wewnętrzny doc id Lucene — inny po każdym
# świeżym indeksie. Ręczna lista 10 z 53 remisujących dawała 0.84–0.89 na
# tych samych danych. Reguła ocenia CAŁĄ grupę remisu tak samo, więc jej
# wewnętrzna kolejność przestaje mieć znaczenie.
#
# ZASADA przy dopisywaniu zapytań: każda grupa remisu `_score` w top-10
# musi mieć JEDNĄ ocenę. Przykład: `słuchawki bezprzewodowe` ma tylko
# regułę kategorii, bo synonim `słuchawki bezprzewodowe => słuchawki`
# (infra/elasticsearch/analysis/synonyms.txt) celowo zrównuje nauszne
# i bezprzewodowe — `name_contains` z oceną 2 rozbiłby grupę remisu.
# Pilnuje tego `search:eval` (kolumna „Remis z różnymi ocenami”, exit 1).
#
# Dane: `php artisan marketplace:seed --n=1500 --fresh` (stały seed Fakera
# 42). Reguły nie zależą od ID-ków, więc działają także na innej liczbie
# produktów — ale baseline w docs/POMIARY.md (sekcja 5a) dotyczy tego seeda.

queries:
    - query: 'Wyman-Howell Laptop Ultra 14"'
      relevant:
          - { name: 'Wyman-Howell Laptop Ultra 14"', grade: 3 }

    - query: 'Bailey Ltd Smartfon Nova 128GB'
      relevant:
          - { name: 'Bailey Ltd Smartfon Nova 128GB', grade: 3 }

    # Sama marka jako wolny tekst — trafia też inne marki z „PLC” w nazwie,
    # ale niżej niż każdy produkt Orn PLC.
    - query: 'Orn PLC'
      relevant:
          - { brand: 'Orn PLC', grade: 1 }

    - query: 'smartfon'
      relevant:
          - { category: 'Smartfony', grade: 1 }

    - query: 'buty do biegania'
      relevant:
          - { category: 'Buty do biegania', grade: 1 }

    # „Kurtka zimowa” > inne kurtki: nazwy z obu słowami mają wyższy `_score`
    # niż sama „kurtka”, więc grupy remisu nie mieszają ocen 2 i 1.
    - query: 'kurtka zimowa'
      relevant:
          - { name_contains: 'Kurtka zimowa', grade: 2 }
          - { category: 'Kurtki', grade: 1 }

    - query: 'meble ogrodowe'
      relevant:
          - { category: 'Meble ogrodowe', grade: 1 }

    # Kategoria „Narzędzia” to też szlifierki i zestawy — nie są trafne.
    - query: 'wiertarka'
      relevant:
          - { name_contains: 'Wiertarka', grade: 1 }

    - query: 'rower górski'
      relevant:
          - { name_contains: 'Rower górski', grade: 2 }
          - { category: 'Rowery', grade: 1 }

    # Synonim (infra/elasticsearch/analysis/synonyms.txt: "laptop, notebook,
    # komputer przenośny") — cała kategoria laptopów.
    - query: 'notebook'
      relevant:
          - { category: 'Laptopy', grade: 1 }

    # Synonim ("telefon, smartfon, komórka") — to samo co "smartfon".
    - query: 'komórka'
      relevant:
          - { category: 'Smartfony', grade: 1 }

    - query: 'telefon'
      relevant:
          - { category: 'Smartfony', grade: 1 }

    # Synonim redukujący ("słuchawki bezprzewodowe => słuchawki") — patrz
    # ZASADA w nagłówku: tylko kategoria, bez rozróżnienia typu słuchawek.
    - query: 'słuchawki bezprzewodowe'
      relevant:
          - { category: 'Słuchawki', grade: 1 }
