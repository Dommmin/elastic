# ============================================================================
#  Marketplace Search Platform — stack lokalny
#
#  PROFILE:
#    (brak)   -> postgres, redis, es01, kibana, rabbitmq        [ETAP 1-3]
#    cluster  -> + es02, es03  (klaster 3-nodowy, tryb docelowy — D-12)
#    apps     -> + catalog (Laravel) i search (Symfony)         [ETAP 4-5]
#    obs      -> + filebeat, metricbeat                         [ETAP 11]
#    tools    -> + mailpit, minio
#
#  Uruchomienie:  make up  |  make up-cluster
# ============================================================================

name: ${COMPOSE_PROJECT_NAME:-marketplace}

# --- wspólna konfiguracja node'ów Elasticsearcha ----------------------------
x-es-common: &es-common
  image: marketplace/elasticsearch:${ES_VERSION}
  build:
    context: ./infra/elasticsearch
    args:
      ES_VERSION: ${ES_VERSION}
  environment: &es-env
    cluster.name: ${ES_CLUSTER_NAME}
    ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    ES_JAVA_OPTS: -Xms${ES_HEAP} -Xmx${ES_HEAP}
    # --- bezpieczeństwo (D-10: uczymy się z włączonym) ---
    xpack.security.enabled: "true"
    # TLS transportowy (node <-> node) WŁĄCZONY — wymagany w klastrze wielonodowym.
    xpack.security.transport.ssl.enabled: "true"
    xpack.security.transport.ssl.verification_mode: certificate
    xpack.security.transport.ssl.keystore.path: certs/es.p12
    xpack.security.transport.ssl.truststore.path: certs/es.p12
    # TLS na HTTP WYŁĄCZONY w dev — żeby curl i Kibana były wygodne.
    # W module 12 włączymy i zobaczysz różnicę.
    xpack.security.http.ssl.enabled: "false"
    # --- discovery: ta sama konfiguracja działa dla 1 i dla 3 node'ów ---
    discovery.seed_hosts: es01,es02,es03
    # --- pozostałe ---
    bootstrap.memory_lock: "true"
    path.repo: /snapshots
    # ILM sprawdza polityki co 10 min; w dev chcemy widzieć przejścia od razu (ETAP 10)
    indices.lifecycle.poll_interval: 10s
  ulimits:
    memlock: { soft: -1, hard: -1 }
    nofile: { soft: 65536, hard: 65536 }
  mem_limit: ${ES_MEM_LIMIT}
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        curl -fsS -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health
        | grep -qE '"status":"(green|yellow)"'
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s
  networks: [marketplace]
  restart: unless-stopped

services:

  # ==========================================================================
  #  ETAP 1 — warstwa danych
  # ==========================================================================

  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # przekazywane do skryptu inicjalizacyjnego
      CATALOG_DB: ${CATALOG_DB}
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      SEARCHSVC_DB: ${SEARCHSVC_DB}
      SEARCHSVC_DB_USER: ${SEARCHSVC_DB_USER}
      SEARCHSVC_DB_PASSWORD: ${SEARCHSVC_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=200
      # slow query log — odpowiednik slowloga ES, przyda się w ETAPIE 8
      - -c
      - log_min_duration_statement=500
    volumes:
      # UWAGA: Postgres 18 zmienił zalecany punkt montowania na /var/lib/postgresql
      # (dane lądują w podkatalogu z numerem wersji, żeby dało się użyć
      # `pg_upgrade --link` bez przekraczania granicy montowania).
      # Zamontowanie starego /var/lib/postgresql/data powoduje, że obraz odmawia
      # startu z komunikatem "PostgreSQL data in ... (unused mount/volume)".
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    networks: [marketplace]
    restart: unless-stopped

  redis:
    image: redis:${REDIS_VERSION}-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks: [marketplace]
    restart: unless-stopped

  # ==========================================================================
  #  ETAP 2 — Elasticsearch + Kibana
  # ==========================================================================

  # Kontener jednorazowy: certyfikaty TLS + uprawnienia do wolumenów.
  # Idempotentny — przy kolejnym starcie widzi istniejące certy i kończy pracę.
  es-init:
    image: marketplace/elasticsearch:${ES_VERSION}
    build:
      context: ./infra/elasticsearch
      args:
        ES_VERSION: ${ES_VERSION}
    # Root, bo świeży wolumen należy do root-a. Skrypt na końcu oddaje pliki
    # użytkownikowi elasticsearch (uid 1000) — patrz init-storage.sh.
    user: "0:0"
    command: ["bash", "/usr/local/bin/init-storage.sh"]
    volumes:
      - es-certs:/certs
      - es-snapshots:/snapshots
      - ./infra/elasticsearch/init-storage.sh:/usr/local/bin/init-storage.sh:ro
    networks: [marketplace]
    restart: "no"

  es01:
    <<: *es-common
    container_name: ${COMPOSE_PROJECT_NAME:-marketplace}-es01
    environment:
      <<: *es-env
      node.name: es01
      node.roles: '["master","data","ingest","remote_cluster_client"]'
      # Bootstrap TYLKO przez es01. Dzięki temu ta sama konfiguracja działa
      # w trybie 1-node i 3-node: es01 formuje klaster sam, a es02/es03
      # dołączają później przez discovery.seed_hosts.
      cluster.initial_master_nodes: es01
    volumes:
      - es01-data:/usr/share/elasticsearch/data
      - ./infra/elasticsearch/analysis:/usr/share/elasticsearch/config/analysis:ro
      - es-snapshots:/snapshots
      - es-certs:/usr/share/elasticsearch/config/certs:ro
    ports:
      - "127.0.0.1:${ES_PORT}:9200"
    depends_on:
      es-init:
        condition: service_completed_successfully

  es02:
    <<: *es-common
    container_name: ${COMPOSE_PROJECT_NAME:-marketplace}-es02
    profiles: [cluster]
    environment:
      <<: *es-env
      node.name: es02
      node.roles: '["master","data","ingest","remote_cluster_client"]'
    volumes:
      - es02-data:/usr/share/elasticsearch/data
      - ./infra/elasticsearch/analysis:/usr/share/elasticsearch/config/analysis:ro
      - es-snapshots:/snapshots
      - es-certs:/usr/share/elasticsearch/config/certs:ro
    depends_on:
      es01:
        condition: service_healthy

  es03:
    <<: *es-common
    container_name: ${COMPOSE_PROJECT_NAME:-marketplace}-es03
    profiles: [cluster]
    environment:
      <<: *es-env
      node.name: es03
      node.roles: '["master","data","ingest","remote_cluster_client"]'
    volumes:
      - es03-data:/usr/share/elasticsearch/data
      - ./infra/elasticsearch/analysis:/usr/share/elasticsearch/config/analysis:ro
      - es-snapshots:/snapshots
      - es-certs:/usr/share/elasticsearch/config/certs:ro
    depends_on:
      es01:
        condition: service_healthy

  # Kontener jednorazowy: hasło kibana_system + role i użytkownicy aplikacji.
  # To jest lekcja "jak inicjalizuje się sekrety w klastrze" (ETAP 2).
  es-setup:
    image: marketplace/elasticsearch:${ES_VERSION}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      ES_CATALOG_PASSWORD: ${ES_CATALOG_PASSWORD}
      ES_SEARCHSVC_PASSWORD: ${ES_SEARCHSVC_PASSWORD}
    command: ["bash", "/usr/local/bin/setup-security.sh"]
    volumes:
      - ./infra/elasticsearch/setup-security.sh:/usr/local/bin/setup-security.sh:ro
    depends_on:
      es01:
        condition: service_healthy
    networks: [marketplace]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    environment:
      SERVERNAME: kibana
      ELASTICSEARCH_HOSTS: http://es01:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      # Klucze szyfrujące — bez nich Kibana generuje je losowo przy każdym starcie
      # i gubi zapisane obiekty (alerty, dashboardy). Muszą mieć min. 32 znaki.
      XPACK_SECURITY_ENCRYPTIONKEY: marketplace_local_security_key_32ch
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: marketplace_local_savedobj_key_32c
      XPACK_REPORTING_ENCRYPTIONKEY: marketplace_local_reporting_key_32c
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - kibana-data:/usr/share/kibana/data
    ports:
      - "127.0.0.1:${KIBANA_PORT}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s
    depends_on:
      es-setup:
        condition: service_completed_successfully
    mem_limit: 3g
    networks: [marketplace]
    restart: unless-stopped

  # ==========================================================================
  #  ETAP 3 — RabbitMQ
  # ==========================================================================

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}-management-alpine
    hostname: rabbitmq          # WAŻNE: nazwa node'a RabbitMQ zależy od hostname.
                                # Bez tego po restarcie kontenera node zmienia
                                # nazwę i "gubi" swoje trwałe kolejki.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-marketplace.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    mem_limit: 1g
    networks: [marketplace]
    restart: unless-stopped

  # ==========================================================================
  #  ETAP 4-5 — aplikacje (profil `apps`, po utworzeniu projektów)
  # ==========================================================================

  catalog-app:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/php/catalog.Dockerfile
      # Domyślnie budujemy etap `dev` (kod z volume, OPcache sprawdza pliki).
      # Wersja produkcyjna: docker build --target prod
      target: dev
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
        PHP_VERSION: ${PHP_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    environment:
      SERVER_NAME: ${SERVER_NAME:-catalog.localhost}
      OCTANE_ENABLED: ${OCTANE_ENABLED}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      # DB_CONNECTION jest KLUCZOWE: .env Laravela ma domyślnie sqlite
      # (tak stawia installer). Bez tego nadpisania kontener po cichu
      # ignorowałby DB_HOST/DB_DATABASE poniżej i pisał do pliku SQLite,
      # mimo że Postgres jest skonfigurowany i zdrowy.
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${CATALOG_DB}
      DB_USERNAME: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      ELASTICSEARCH_HOST: http://es01:9200
      ELASTICSEARCH_USER: catalog
      ELASTICSEARCH_PASSWORD: ${ES_CATALOG_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      VITE_DEV_SERVER: http://catalog-vite:5173
    volumes:
      - ./apps/catalog:/app
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:${CATALOG_HTTP_PORT}:80"
      - "127.0.0.1:${CATALOG_HTTPS_PORT}:443"
      - "127.0.0.1:${CATALOG_HTTPS_PORT}:443/udp"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      es01: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [marketplace]
    restart: unless-stopped

  catalog-vite:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/php/catalog.Dockerfile
      # NIE zwykły node:alpine — @laravel/vite-plugin-wayfinder wymaga PHP
      # w tym samym kontenerze (shelluje do `php artisan wayfinder:generate`
      # przy każdym starcie Vite). Patrz komentarz przy targecie `vite`.
      target: vite
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
        PHP_VERSION: ${PHP_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    volumes:
      - ./apps/catalog:/app
    ports:
      - "127.0.0.1:${VITE_PORT}:5173"
    mem_limit: 1g
    networks: [marketplace]
    restart: unless-stopped

  search-consumer:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/php/search.Dockerfile
      target: dev
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
        PHP_VERSION: ${PHP_VERSION}
    # Transport nazywa się product_sync, NIE "sync" — patrz komentarz w
    # apps/search/config/packages/messenger.yaml (kolizja z wbudowaną nazwą).
    command: ["php", "bin/console", "messenger:consume", "product_sync", "-vv", "--time-limit=3600", "--memory-limit=256M"]
    environment:
      # BRAK APP_ENV tutaj celowo: Symfony i Laravel mają różne konwencje
      # (dev/prod/test vs local/production) i współdzielony APP_ENV z jednego
      # .env powodował crash "environment local is not registered". Każda
      # apka rządzi swoim APP_ENV z WŁASNEGO pliku .env (już poprawnie dev).
      # serverVersion jest WYMAGANY: bez niego Doctrine DBAL rzuca
      # "Invalid platform version" zamiast autodetekcji (znalezione dopiero
      # przy realnym uruchomieniu migracji — Postgres-specific SQL nie da
      # się zweryfikować bez żywej bazy, patrz README "Stan ETAPU 6").
      # UWAGA: Doctrine wymaga formatu major.minor.PATCH, a nasz
      # POSTGRES_VERSION (obraz) to tylko "18.4" — stąd osobna, jawna wartość
      # tutaj, nie ${POSTGRES_VERSION} wprost.
      DATABASE_URL: postgresql://${SEARCHSVC_DB_USER}:${SEARCHSVC_DB_PASSWORD}@postgres:5432/${SEARCHSVC_DB}?serverVersion=18.4.0&charset=utf8
      ELASTICSEARCH_HOST: http://es01:9200
      ELASTICSEARCH_USER: searchsvc
      ELASTICSEARCH_PASSWORD: ${ES_SEARCHSVC_PASSWORD}
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
      # Zwykłe HTTP na nazwę serwisu dockerowego, port 80 — NIE
      # https://catalog.localhost. Patrz komentarz w infra/caddy/Caddyfile
      # przy bloku "catalog-app:80" (SNI nie pasowałby do certyfikatu
      # wystawionego dla catalog.localhost).
      CATALOG_INTERNAL_BASE_URL: http://catalog-app
    volumes:
      - ./apps/search:/app
      # search-consumer widzi TYLKO ./apps/search jako /app — infra/ w repo
      # root w ogóle nie istnieje w jego systemie plików. CreateSearchIndexCommand
      # (search:index:create) czyta stąd mapowanie products-v1.json — ta sama
      # zawartość, którą montujemy też do node'ów ES (analysis/synonyms.txt).
      - ./infra/elasticsearch/mappings:/infra/elasticsearch/mappings:ro
    depends_on:
      postgres: { condition: service_healthy }
      catalog-app: { condition: service_healthy }
      es01: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [marketplace]
    restart: unless-stopped

  # ==========================================================================
  #  Profil `tools`
  # ==========================================================================

  mailpit:
    profiles: [tools]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    mem_limit: 256m
    networks: [marketplace]
    restart: unless-stopped

networks:
  marketplace:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  es01-data:
  es02-data:
  es03-data:
  es-certs:
  es-snapshots:
  kibana-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
