# ============================================================================
#  Łatki overlayu g5-local (ETAP G5): kasują wszystko, co nie leży na ścieżce
#  komunikatów sklepu (outbox-publisher -> RabbitMQ -> search-consumer -> ES).
#  Baza (deploy/k8s) zostaje nietknięta. `$patch: delete` działa na obiektach
#  z bazy. catalog-app ZOSTAJE: search-consumer po każdym evencie dopytuje go o
#  projekcję (CATALOG_INTERNAL_BASE_URL), bez niego nic nie trafi do ES.
#  NetworkPolicy zostają (selektory bez podów nic nie robią).
# ============================================================================
