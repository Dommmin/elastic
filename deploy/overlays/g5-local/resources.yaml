# Limity pamięci pod k3d (budżet renderu: suma <= 4,5 Gi, patrz tools/k3d/g5-check.rb).
# Postgres: shared_buffers=512MB z bazy, więc limit nie niżej niż 1Gi.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
---
# Stary RabbitMQ (źródło shovela w G5) — wystarczy 512Mi.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  template:
    spec:
      containers:
        - name: rabbitmq
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 512Mi }
