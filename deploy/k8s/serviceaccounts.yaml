# ============================================================================
#  ServiceAccount per aplikacja (ETAP G2)
#
#  Do G2 wszystkie pody używały konta `default` z zamontowanym tokenem API
#  (/var/run/secrets/kubernetes.io/serviceaccount/token). Żadna aplikacja
#  w marketplace nie rozmawia z API Kubernetesa, więc token był tylko
#  prezentem dla włamywacza: z nim `curl https://kubernetes.default.svc`
#  zamiast pustej odpowiedzi.
#
#  Dlaczego osobne konta, skoro żadne nie ma uprawnień:
#    - automountServiceAccountToken: false na KONCIE działa dla każdego poda,
#      także dodanego później (pole w podzie wygrywa, ale domyślnie bierze konto);
#    - RBAC przypina się do konta: gdy któraś aplikacja kiedyś będzie potrzebować
#      API, dostaje Role tylko ona, a nie wszystkie pody z `default`;
#    - w logach audytu API servera widać, KTO pytał (system:serviceaccount:marketplace:catalog).
#
#  Jedyne konto, które API potrzebuje, to `deployer` (rbac.yaml) — dla narzędzi,
#  nie dla podów.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog          # catalog-app, outbox-publisher, catalog-worker, catalog-scheduler, Job migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search           # search-consumer, search-metrics
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres         # postgres-0 (baza + eksporter), CronJob pg-backup
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glitchtip        # Deployment glitchtip + Joby glitchtip-db-setup, glitchtip-setup
  labels:
    # GlitchTip jest opcjonalny (glitchtip.yaml): deploy.sh nakłada jego zasoby
    # osobnym krokiem. errors-init idzie w nim PIERWSZE — przed Jobem
    # glitchtip-db-setup, który z tego konta korzysta.
    app.kubernetes.io/component: errors-init
automountServiceAccountToken: false
