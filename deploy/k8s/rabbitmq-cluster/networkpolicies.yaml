# ============================================================================
#  Polityki sieciowe rabbitmq-ha (ETAP G5). Baza ma default-deny Ingress+Egress,
#  allow-dns i allow-egress-in-namespace (ruch między podami namespace).
#  Tu: kto wchodzi do rabbitmq-ha, dokąd wychodzi rabbitmq-ha i kto może do
#  starego rabbitmq (źródło Shovela).
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ha-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rabbitmq-ha }
  policyTypes: [Ingress]
  ingress:
    # Klienci AMQP (5672) i stream (5552). perf-test = obciążenie z późniejszych zadań.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [outbox-publisher, search-consumer, perf-test]
      ports:
        - port: 5672
        - port: 5552
    # Węzły klastra: epmd (4369), dystrybucja Erlanga (25672), AMQP i stream
    # (klienci stream i kolejki kworum rozmawiają też między replikami).
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq-ha }
      ports:
        - port: 4369
        - port: 25672
        - port: 5672
        - port: 5552
    # Operatory (rabbitmq-system) wołają API zarządzania — tak działa m.in.
    # messaging-topology-operator.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: rabbitmq-system }
      ports:
        - port: 15672
---
# Peer discovery (rabbit_peer_discovery_k8s) pyta API Kubernetes o endpointy.
# default-deny Egress to blokuje; allow-egress-in-namespace obejmuje tylko pody.
# kube-router ocenia egress PO DNAT-cie Service'u, więc realnym celem nie jest
# kubernetes.default (10.43.0.1:443), tylko Endpoints `kubernetes`: węzeł server-0
# na porcie 6443 (k3d: 172.22.0.3:6443). Reguła: tylko 6443 i tylko sieć Dockera
# k3d-elastic-g5 (172.22.0.0/16, tam są wyłącznie węzły). /32 odrzucone: adres
# server-0 zmienia się po odtworzeniu klastra, podsieć sieci k3d nie.
# Podsieć sprawdź: `docker network inspect k3d-elastic-g5 -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'`;
# inna niż 172.22.0.0/16 = popraw tu i w tools/k3d/g5-check.rb. Na VPS (k3s,
# API na IP hosta:6443) ta polityka nie jest używana — to dodatek overlayu G5.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ha-egress-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rabbitmq-ha }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 172.22.0.0/16 }
      ports:
        - { port: 6443, protocol: TCP }
---
# Shovel: rabbitmq-ha (cel) czyta ze starego rabbitmq:5672. Egress rabbitmq-ha
# do podów namespace przepuszcza allow-egress-in-namespace; brakuje ingressu.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-ha
spec:
  podSelector:
    matchLabels: { app: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq-ha }
      ports:
        - port: 5672
