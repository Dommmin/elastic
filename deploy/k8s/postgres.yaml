# ============================================================================
#  Postgres jako StatefulSet (ETAP D2, Task 5) — odpowiednik usługi `postgres`
#  z compose.yaml. Obraz z D1 (skrypt tworzący bazy catalog i searchsvc).
#
#  StatefulSet, nie Deployment, bo:
#    - stała nazwa poda (postgres-0) i stała tożsamość po restarcie;
#    - volumeClaimTemplates: PVC przypięty do TEGO poda (data-postgres-0),
#      przeżywa usunięcie poda — odpowiednik nazwanego wolumenu pg-data.
#  Headless Service (clusterIP: None): DNS `postgres` wskazuje wprost na pod,
#  bez wirtualnego IP — dla baz to typowe (połączenia są długie, LB zbędny).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    # Po tej etykiecie ServiceMonitor (deploy/monitoring) znajduje Service.
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
    # Sidecar postgres-exporter (ETAP G1) — scrape przez ServiceMonitor.
    - name: metrics
      port: 9187
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # Pod ma dwa kontenery (baza + eksporter). `kubectl exec/logs postgres-0`
        # bez `-c` trafia wtedy tutaj — skrypty (verify.sh, migrate-from-compose.sh)
        # i nawyki z D2 działają bez zmian.
        kubectl.kubernetes.io/default-container: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      # Profil „restricted” (ETAP G2). Oficjalny obraz startuje jako root tylko po
      # to, żeby zrobić chown katalogu danych i przejść na użytkownika postgres
      # (gosu). Katalog danych na PVC już należy do uid 70 (sprawdzone: ls -ln),
      # więc startujemy od razu jako 70 — entrypoint pomija chown, gdy nie jest rootem.
      # fsGroup nie działa na wolumenach local-path (to hostPath), więc
      # o własności PVC decyduje to, kto go założył — tu: dotychczasowy root+gosu.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70      # postgres w obrazie alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: ghcr.io/dommmin/elastic-postgres:placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Te same parametry co w compose.yaml.
          args:
            - postgres
            - -c
            - shared_buffers=512MB
            - -c
            - max_connections=200
            - -c
            - log_min_duration_statement=500
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: POSTGRES_PASSWORD } }
            # Czyta je skrypt init z obrazu (01-databases.sh).
            - name: CATALOG_DB
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB } }
            - name: CATALOG_DB_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB_USER } }
            - name: CATALOG_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_DB_PASSWORD } }
            - name: SEARCHSVC_DB
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: SEARCHSVC_DB } }
            - name: SEARCHSVC_DB_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: SEARCHSVC_DB_USER } }
            - name: SEARCHSVC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: SEARCHSVC_DB_PASSWORD } }
          ports:
            - containerPort: 5432
          # healthcheck z compose -> readiness (czy kierować ruch) i liveness
          # (czy zrestartować). W compose był JEDEN healthcheck do obu celów.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 2Gi }
          volumeMounts:
            # Postgres 18: punkt montowania /var/lib/postgresql (komentarz w compose.yaml)
            - name: data
              mountPath: /var/lib/postgresql
            # Gniazdo unixowe i plik blokady (.s.PGSQL.5432) — jedyne miejsca
            # poza katalogiem danych, w których Postgres pisze.
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
        # --------------------------------------------------------------------
        # Eksporter metryk jako DRUGI kontener w podzie bazy (ETAP G1) — wzorzec
        # „adapter” z CKAD: tłumaczy stan Postgresa na format Prometheusa.
        # Dlaczego w tym samym podzie, a nie osobny Deployment:
        #   - łączy się po localhost (te same namespace sieciowe kontenerów poda),
        #     więc nie potrzebuje Service do bazy ani reguły NetworkPolicy (G2);
        #   - żyje i umiera razem z bazą: eksporter bez bazy jest bezużyteczny.
        # Kompromis: konto superużytkownika z istniejącego Secretu. Osobna rola
        # z `pg_monitor` wymagałaby SQL na istniejącym PVC (skrypty init z obrazu
        # działają tylko przy pustym katalogu danych) — RUNBOOK #080.
        # Uwaga: zmiana tego szablonu = restart postgres-0 (StatefulSet, 1 replika).
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          securityContext:
            runAsUser: 65534   # nobody — użytkownik z obrazu eksportera, nie uid bazy
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: POSTGRES_USER } }
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - name: metrics
              containerPort: 9187
          # /metrics odpowiada też, gdy baza leży (pg_up 0) — sonda pilnuje
          # tylko samego eksportera, żeby awaria bazy nie restartowała go w kółko.
          livenessProbe:
            httpGet: { path: /metrics, port: 9187 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { memory: 24Mi, cpu: 10m }
            limits: { memory: 96Mi }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
