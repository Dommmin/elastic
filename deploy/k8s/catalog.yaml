# ============================================================================
#  catalog (Laravel) + outbox-publisher (ETAP D2, Task 6)
#  Ten sam obraz, dwie role — jak w compose (catalog-app + outbox-publisher).
#
#  Etykieta app.kubernetes.io/component: app — tools/k3s/deploy.sh nakłada
#  te obiekty DOPIERO po zakończeniu Joba migracji (schemat przed kodem).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  # Nazwa MUSI być `catalog-app`: Caddyfile w obrazie ma blok
  # `http://catalog-app` dla wewnętrznego API projekcji (search -> catalog).
  name: catalog-app
  labels:
    app.kubernetes.io/component: app
    # Po tej etykiecie ServiceMonitor (deploy/monitoring) znajduje Service.
    app: catalog-app
spec:
  selector:
    app: catalog-app
  ports:
    - name: http
      port: 80
    # Metryki Caddy (/metrics) i Laravela (/prometheus) — osobny port, jak w Compose
    # (Caddyfile, blok http://:2020). Scrape'uje go Prometheus przez ServiceMonitor
    # (deploy/monitoring/servicemonitors.yaml, ETAP G1).
    - name: metrics
      port: 2020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-app
  labels:
    app.kubernetes.io/component: app
spec:
  # BEZ `replicas`: liczbą replik steruje HPA (hpa.yaml). Gdyby pole tu było,
  # każdy `make k3s-deploy` (kubectl apply) cofałby skalowanie HPA do 1 —
  # w środku szczytu ruchu (RUNBOOK #083).
  #
  # Selektor z `track: stable` (ETAP G2): Service catalog-app wybiera pody po
  # samym `app: catalog-app`, więc trafia i do stabilnych, i do canary
  # (tools/k3s/canary.sh). Deploymenty muszą mieć ROZŁĄCZNE selektory, inaczej
  # oba uznałyby cudze pody za swoje. Selektor Deploymentu jest niezmienny —
  # przejście ze starego robi raz tools/k3s/deploy.sh (--cascade=orphan).
  selector:
    matchLabels:
      app: catalog-app
      track: stable
  template:
    metadata:
      labels:
        app: catalog-app
        track: stable
    spec:
      serviceAccountName: catalog
      automountServiceAccountToken: false
      # Profil „restricted” (ETAP G2). Sprawdzone na obrazie przed wdrożeniem
      # (docker run --user 33 --read-only --cap-drop ALL, przewodnik etap-g2, sekcja 3).
      securityContext:
        runAsNonRoot: true
        runAsUser: 33      # www-data — właściciel storage/ i bootstrap/cache w obrazie
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      # readOnlyRootFilesystem zamyka /app, a Laravel pisze w storage/ (widoki,
      # cache) i bootstrap/cache/ (config:cache w catalog-entrypoint.sh). Pusty
      # emptyDir zakryłby to, co obraz ma tam już gotowe (route:cache, view:cache),
      # więc init kontener kopiuje zawartość z obrazu do wolumenów — wzorzec
      # „init container przygotowuje dane” z CKAD.
      initContainers:
        - name: writable-dirs
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          command: ["sh", "-c", "cp -R /app/storage/. /work/storage/ && cp -R /app/bootstrap/cache/. /work/bootstrap-cache/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: storage, mountPath: /work/storage }
            - { name: bootstrap-cache, mountPath: /work/bootstrap-cache }
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: catalog
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Binarka frankenphp ma file capability cap_net_bind_service=ep
              # (żeby nie-root mógł słuchać na :80). Gdy tej capability nie ma
              # w zbiorze ograniczającym kontenera, exec kończy się EPERM:
              # „exec: frankenphp: Operation not permitted” — sprawdzone.
              add: [NET_BIND_SERVICE]
          envFrom:
            - configMapRef:
                name: marketplace-config
          env:
            # Tag `process` zdarzeń w GlitchTipie (ADR-0009); SDK jest wyłączone, dopóki DSN
            # w marketplace-config jest pusty.
            - name: ERROR_TRACKING_PROCESS
              value: http
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: SENTRY_LARAVEL_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_CATALOG, optional: true } }
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: SENTRY_FRONTEND_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_FRONTEND, optional: true } }
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: GLITCHTIP_FRONTEND_KEY
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: GLITCHTIP_KEY_FRONTEND, optional: true } }
            # Sekret HMAC webhooka bramki (ETAP F): worker podpisuje, catalog-app sprawdza.
            # optional: bez klucza w Secrecie kontroler odrzuca webhooki (500) — RUNBOOK #085.
            - name: FAKE_GATEWAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: FAKE_GATEWAY_WEBHOOK_SECRET, optional: true } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_APP_KEY } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB } }
            - name: DB_USERNAME
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: REDIS_PASSWORD } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: RABBITMQ_PASSWORD } }
            - name: ELASTICSEARCH_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: ES_CATALOG_USER } }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: ES_CATALOG_PASSWORD } }
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 2020
          # /up = liveness Laravela (bez zależności) — ten sam wybór co
          # w healthchecku compose; /health (z zależnościami) świadomie nie.
          #
          # startupProbe (ETAP G2) zamiast initialDelaySeconds: liveness i readiness
          # nie ruszają, dopóki ta sonda raz nie przejdzie. Budżet startu to
          # failureThreshold × periodSeconds = 60 s, ale zdrowy pod jest gotowy po
          # ~3 s (pierwsze udane /up), a nie po sztywnych 30 s jak wcześniej —
          # przy skalowaniu HPA każda sekunda czekania to sekunda przeciążenia.
          startupProbe:
            httpGet: { path: /up, port: 80 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /up, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /up, port: 80 }
            periodSeconds: 15
            failureThreshold: 4
          # cpu: 100m to także mianownik HPA: „70% CPU” = 70m średnio na pod.
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: storage, mountPath: /app/storage }
            - { name: bootstrap-cache, mountPath: /app/bootstrap/cache }
            - { name: tmp, mountPath: /tmp }
            # Caddy: XDG_DATA_HOME=/data (lokalne CA z `local_certs`), XDG_CONFIG_HOME=/config (autosave.json)
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: bootstrap-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: caddy-data, emptyDir: {} }
        - { name: caddy-config, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  labels:
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      serviceAccountName: catalog
      automountServiceAccountToken: false
      # Ten sam profil co catalog-app (komentarze tam); bez NET_BIND_SERVICE, bo
      # `php artisan` nie słucha na porcie.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: writable-dirs
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          command: ["sh", "-c", "cp -R /app/storage/. /work/storage/ && cp -R /app/bootstrap/cache/. /work/bootstrap-cache/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: storage, mountPath: /work/storage }
            - { name: bootstrap-cache, mountPath: /work/bootstrap-cache }
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: publisher
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          args: ["php", "artisan", "outbox:publish", "--loop"]
          envFrom:
            - configMapRef:
                name: marketplace-config
          # Te same zmienne co catalog-app (kotwice YAML nie działają między
          # dokumentami rozdzielonymi `---`, więc lista jest powtórzona).
          env:
            # Tag `process` zdarzeń w GlitchTipie (ADR-0009); SDK jest wyłączone, dopóki DSN
            # w marketplace-config jest pusty.
            - name: ERROR_TRACKING_PROCESS
              value: outbox-publisher
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: SENTRY_LARAVEL_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_CATALOG, optional: true } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_APP_KEY } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB } }
            - name: DB_USERNAME
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: REDIS_PASSWORD } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: RABBITMQ_PASSWORD } }
            - name: ELASTICSEARCH_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: ES_CATALOG_USER } }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: ES_CATALOG_PASSWORD } }
          # PID 1 to proces artisan — sprawdzamy, że to wciąż on (jak w compose).
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -q 'outbox:publish' /proc/1/cmdline"]
            periodSeconds: 30
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: storage, mountPath: /app/storage }
            - { name: bootstrap-cache, mountPath: /app/bootstrap/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: bootstrap-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-worker
  labels:
    app.kubernetes.io/component: app
spec:
  # DOKŁADNIE JEDNA replika i Recreate zamiast domyślnego RollingUpdate.
  # Polityki blokady/odblokowania (SuspendOffersOfBlockedSeller,
  # ReinstateOffersOfUnblockedSeller) sprawdzają status sprzedawcy tylko na
  # starcie joba i zakładają kolejność FIFO na jednym workerze. RollingUpdate
  # (maxSurge 1, brak readinessProbe) uruchamia nowy pod, zanim stary skończy
  # job: „zablokuj” na starym i „odblokuj” na nowym mogą się przeplatać,
  # a sprzedawca zostaje aktywny z ofertami zawieszonymi na zawsze.
  # Recreate najpierw zatrzymuje stary pod, potem startuje nowy. Koszt:
  # przy wdrożeniu kolejka chwilę stoi (joby czekają w `jobs`, nic nie ginie).
  # RUNBOOK #040.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog-worker
  template:
    metadata:
      labels:
        app: catalog-worker
    spec:
      # Na SIGTERM `queue:work` kończy BIEŻĄCY job i dopiero wtedy wychodzi.
      # Domyślne 30 s to za mało dla sprzedawcy z setkami ofert; zabity job
      # wraca dopiero po `retry_after` = 660 s, a przez ten czas oferty
      # zablokowanego sprzedawcy są wciąż widoczne. 120 s wystarcza typowemu
      # jobowi. Dłuższy (limit `--timeout=600`) i tak jest bezpieczny do
      # przerwania: joby są idempotentne, ponowienie kontynuuje od ofert,
      # które jeszcze nie zmieniły stanu.
      terminationGracePeriodSeconds: 120
      serviceAccountName: catalog
      automountServiceAccountToken: false
      # Ten sam profil co catalog-app (komentarze tam); bez NET_BIND_SERVICE, bo
      # `php artisan` nie słucha na porcie.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: writable-dirs
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          command: ["sh", "-c", "cp -R /app/storage/. /work/storage/ && cp -R /app/bootstrap/cache/. /work/bootstrap-cache/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: storage, mountPath: /work/storage }
            - { name: bootstrap-cache, mountPath: /work/bootstrap-cache }
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: worker
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          args: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=5", "--max-time=3600", "--timeout=600"]
          envFrom:
            - configMapRef:
                name: marketplace-config
          # Te same zmienne co catalog-app (kotwice YAML nie działają między
          # dokumentami rozdzielonymi `---`, więc lista jest powtórzona).
          env:
            # Tag `process` zdarzeń w GlitchTipie (ADR-0009); SDK jest wyłączone, dopóki DSN
            # w marketplace-config jest pusty.
            - name: ERROR_TRACKING_PROCESS
              value: queue
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: SENTRY_LARAVEL_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_CATALOG, optional: true } }
            # Sekret HMAC webhooka bramki (ETAP F): worker podpisuje, catalog-app sprawdza.
            # optional: bez klucza w Secrecie kontroler odrzuca webhooki (500) — RUNBOOK #085.
            - name: FAKE_GATEWAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: FAKE_GATEWAY_WEBHOOK_SECRET, optional: true } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_APP_KEY } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB } }
            - name: DB_USERNAME
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: REDIS_PASSWORD } }
          # PID 1 to proces artisan — sprawdzamy, że to wciąż on (jak w compose).
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -q 'queue:work' /proc/1/cmdline"]
            periodSeconds: 30
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: storage, mountPath: /app/storage }
            - { name: bootstrap-cache, mountPath: /app/bootstrap/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: bootstrap-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
# Scheduler Laravela (`schedule:work`, ETAP F, RUNBOOK #044): co minutę sweep `orders:expire-overdue`.
# Bez niego zamówienia bez płatności nie wygasają, a towar zostaje zarezerwowany. DOKŁADNIE jedna
# replika i Recreate: `withoutOverlapping` chroni przed nakładaniem się przebiegów, nie przed
# kilkoma schedulerami. Kroki sagi wykonuje catalog-worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-scheduler
  labels:
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog-scheduler
  template:
    metadata:
      labels:
        app: catalog-scheduler
    spec:
      serviceAccountName: catalog
      automountServiceAccountToken: false
      # Ten sam profil co catalog-app (komentarze tam); bez NET_BIND_SERVICE, bo
      # `php artisan` nie słucha na porcie.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: writable-dirs
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          command: ["sh", "-c", "cp -R /app/storage/. /work/storage/ && cp -R /app/bootstrap/cache/. /work/bootstrap-cache/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: storage, mountPath: /work/storage }
            - { name: bootstrap-cache, mountPath: /work/bootstrap-cache }
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: scheduler
          image: ghcr.io/dommmin/elastic-catalog:placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          args: ["php", "artisan", "schedule:work"]
          envFrom:
            - configMapRef:
                name: marketplace-config
          # Te same zmienne co catalog-worker (kotwice YAML nie działają między dokumentami).
          env:
            # Tag `process` zdarzeń w GlitchTipie (ADR-0009).
            - name: ERROR_TRACKING_PROCESS
              value: scheduler
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: SENTRY_LARAVEL_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_CATALOG, optional: true } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_APP_KEY } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB } }
            - name: DB_USERNAME
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: CATALOG_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: CATALOG_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: REDIS_PASSWORD } }
          # PID 1 to proces artisan; `schedule:work` żyje bez końca (jak healthcheck w compose).
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -q 'schedule:work' /proc/1/cmdline"]
            initialDelaySeconds: 15
            periodSeconds: 30
          # 256Mi, nie 128Mi: `schedule:work` (~63 MB) uruchamia przy każdym przebiegu proces potomny
          # `schedule:run` (RUNBOOK #048), więc 128Mi kończyło się OOM.
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: storage, mountPath: /app/storage }
            - { name: bootstrap-cache, mountPath: /app/bootstrap/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: bootstrap-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
