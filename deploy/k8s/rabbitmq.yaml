# ============================================================================
#  RabbitMQ jako StatefulSet (ETAP D2, Task 5). Obraz z D1: topologia
#  w środku, hash hasła liczony przy starcie (infra/rabbitmq/entrypoint.sh).
#
#  Nazwa node'a RabbitMQ zależy od hostname. W compose trzeba było jawnie
#  ustawić `hostname: rabbitmq` (inaczej po restarcie node zmieniał nazwę
#  i gubił trwałe kolejki). StatefulSet daje stały hostname `rabbitmq-0`
#  za darmo — to dokładnie ten problem, dla którego StatefulSet powstał.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    # Po tej etykiecie ServiceMonitor (deploy/monitoring) znajduje Service.
    app: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
    # Wtyczka rabbitmq_prometheus (infra/rabbitmq/enabled_plugins) — ETAP G1.
    - name: prometheus
      port: 15692
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      # WYJĄTEK od profilu restricted (tools/k3s/ckad-check.rb, EXCEPTIONS):
      # infra/rabbitmq/entrypoint.sh zapisuje /etc/rabbitmq/definitions.json z hashem
      # hasła i robi chown, a docker-entrypoint.sh przechodzi na użytkownika rabbitmq
      # przez su-exec — to wymaga roota i CHOWN/SETUID/SETGID. Zostaje to, co nie
      # przeszkadza: seccomp i zakaz eskalacji. G5 zastępuje ten StatefulSet
      # operatorem RabbitMQ (pody od startu jako uid 999).
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: ghcr.io/dommmin/elastic-rabbitmq:placeholder
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: RABBITMQ_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: RABBITMQ_PASSWORD } }
          ports:
            - containerPort: 5672
            - containerPort: 15672
            - containerPort: 15692
          # Sonda TCP, NIE `rabbitmq-diagnostics`: wołanie CLI w trakcie bootu
          # node'a potrafiło położyć kontener (RUNBOOK #033). Port AMQP
          # otwiera się dopiero po wczytaniu definicji (kolejki istnieją).
          #
          # startupProbe (ETAP G2): wcześniej liveness miał initialDelaySeconds: 90
          # „na wszelki wypadek” — za mało przy wolnym dysku (restart po OOM pętlił
          # się), za dużo przy szybkim. Teraz do 5 min na boot, a liveness zaczyna
          # pilnować od pierwszego otwarcia portu.
          startupProbe:
            tcpSocket: { port: 5672 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 5672 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5672 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
