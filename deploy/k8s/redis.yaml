# ============================================================================
#  Redis jako StatefulSet (ETAP D2, Task 5) — odpowiednik usługi `redis`.
#  Obraz publiczny z Docker Hub (bez zmian względem D1, wersja z .env.example).
#  `$(REDIS_PASSWORD)` w args rozwija KUBERNETES ze zmiennej kontenera —
#  to nie jest składnia powłoki.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.8.1-alpine
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: REDIS_PASSWORD } }
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
