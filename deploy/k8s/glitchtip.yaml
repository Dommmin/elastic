# ============================================================================
#  GlitchTip na k3s (ETAP 11b, ADR-0009, docs/superpowers/plans/2026-10-27-*)
#
#  OPCJONALNY: nic z tego pliku nie działa, dopóki na serwerze nie powstanie Secret
#  `glitchtip-secrets` (tools/k3s/secrets.sh robi go z /opt/marketplace/.env, gdy .env
#  ma sekcję GLITCHTIP_*; ./add-glitchtip-env.sh ją dopisuje). Bez Sekretu tools/k3s/deploy.sh
#  pomija ten krok, a aplikacje dostają puste DSN-y (SDK wyłączone).
#
#  Kolejność jak w Compose: db-setup (rola i baza w istniejącym Postgresie) -> glitchtip ->
#  setup (organizacja, projekty, stałe klucze DSN, alerty, token). Etykiety component:
#    errors-init  Job glitchtip-db-setup   errors  Deployment/Service/PVC   errors-setup  Job glitchtip-setup
#  Żadna z nich nie jest `app`, `migrate` ani infrastrukturą: deploy.sh nakłada je osobnym krokiem.
#
#  UI tylko przez tunel (nic nie jest wystawione):
#    make k3s-tunnel && make k3s k="-n marketplace port-forward svc/glitchtip 28000:8000"
#  Adres http://localhost:28000 jest też GLITCHTIP_DOMAIN, więc linki w mailach i API pasują.
#  Poczta nie wychodzi z klastra (EMAIL_URL=consolemail://: treść maili trafia do logów poda).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: glitchtip
  labels:
    app.kubernetes.io/component: errors
spec:
  selector:
    app: glitchtip
  ports:
    - name: http
      port: 8000
---
# Przesyłane pliki (source mapy po uploadzie sentry-cli). Odpowiednik wolumenu
# glitchtip-uploads z Compose; zdarzenia są w Postgresie, nie tutaj.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glitchtip-uploads
  labels:
    app.kubernetes.io/component: errors
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: glitchtip-db-setup
  labels:
    app.kubernetes.io/component: errors-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: errors-init
    spec:
      restartPolicy: Never
      containers:
        - name: db-setup
          image: ghcr.io/dommmin/elastic-glitchtip:placeholder
          command: ["python", "/opt/marketplace/setup_db.py"]
          envFrom:
            - secretRef: { name: glitchtip-secrets }
          env:
            - name: PGHOST
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: DB_HOST } }
            - name: PGUSER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: POSTGRES_PASSWORD } }
---
# all-in-one: worker w procesie WWW, bez Valkey (VALKEY_URL="" -> kolejka, cache i sesje
# w Postgresie). Jedna replika i Recreate: PVC jest ReadWriteOnce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip
  labels:
    app.kubernetes.io/component: errors
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glitchtip
  template:
    metadata:
      labels:
        app: glitchtip
    spec:
      containers:
        - name: glitchtip
          image: ghcr.io/dommmin/elastic-glitchtip:placeholder
          envFrom:
            - secretRef: { name: glitchtip-secrets }
          env:
            - name: GLITCHTIP_DOMAIN
              value: http://localhost:28000
            # Na k3s GlitchTip jest widziany przez tunel jako localhost, więc samą domeną
            # guard.py prod od dev nie odróżni: STRICT odrzuca wartości z repo.
            - name: GLITCHTIP_STRICT_SECRETS
              value: "true"
            - name: GLITCHTIP_EMBED_WORKER
              value: "true"
            - name: VALKEY_URL
              value: ""
            - name: EMAIL_URL
              value: consolemail://
            - name: DEFAULT_FROM_EMAIL
              value: glitchtip@marketplace.localhost
            - name: ENABLE_USER_REGISTRATION
              value: "false"
            - name: ENABLE_ORGANIZATION_CREATION
              value: "false"
            - name: GLITCHTIP_ENABLE_LOGS
              value: "false"
            - name: GLITCHTIP_ENABLE_UPTIME
              value: "false"
            - name: ENABLE_OBSERVABILITY_API
              value: "true"
            - name: GLITCHTIP_RETENTION_DAYS
              value: "14"
          ports:
            - containerPort: 8000
          readinessProbe:
            exec: { command: ["python", "/opt/marketplace/healthcheck.py"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: { command: ["python", "/opt/marketplace/healthcheck.py"] }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: uploads
              mountPath: /code/uploads
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 512Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: glitchtip-uploads }
---
# Bootstrap: organizacja, projekty (catalog=1, catalog-frontend=2, search=3), stałe klucze DSN,
# reguły alertów, token API. guard.py odmawia wartości deweloperskich z repo (STRICT).
apiVersion: batch/v1
kind: Job
metadata:
  name: glitchtip-setup
  labels:
    app.kubernetes.io/component: errors-setup
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: errors-setup
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: ghcr.io/dommmin/elastic-glitchtip:placeholder
          command: ["sh", "-c", "python /opt/marketplace/guard.py && ./manage.py shell < /opt/marketplace/bootstrap.py"]
          envFrom:
            - secretRef: { name: glitchtip-secrets }
          env:
            - name: GLITCHTIP_DOMAIN
              value: http://localhost:28000
            - name: GLITCHTIP_STRICT_SECRETS
              value: "true"
            - name: GLITCHTIP_EMBED_WORKER
              value: "true"
            - name: VALKEY_URL
              value: ""
            - name: EMAIL_URL
              value: consolemail://
