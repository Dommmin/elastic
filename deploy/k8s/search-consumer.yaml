# ============================================================================
#  search-consumer (Symfony Messenger) — ETAP D2, Task 6
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-consumer
  labels:
    app.kubernetes.io/component: app
    # Etykieta na SAMYM Deploymencie (nie tylko na podach): tools/k3s/deploy.sh
    # wybiera po niej consumer osobno od catalogu (`apply -l`), żeby wdrożyć
    # go dopiero po rolloucie catalog-app — patrz komentarz w kroku 3/3.
    app: search-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-consumer
  template:
    metadata:
      labels:
        app: search-consumer
    spec:
      serviceAccountName: search
      automountServiceAccountToken: false
      # Profil „restricted” (ETAP G2), sprawdzony na obrazie: cache Symfony jest
      # rozgrzany w buildzie (var/cache/prod, tylko do odczytu wystarcza), logi
      # idą na stderr. Zapisywalny jest tylko /tmp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33      # www-data (obraz FrankenPHP); pliki /app należą do roota i są czytelne dla wszystkich
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: consumer
          image: ghcr.io/dommmin/elastic-search:placeholder
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          envFrom:
            - configMapRef:
                name: marketplace-config
          env:
            # Tag `process` zdarzeń w GlitchTipie (ADR-0009); SDK jest wyłączone, dopóki DSN
            # w marketplace-config jest pusty.
            - name: ERROR_TRACKING_PROCESS
              value: consumer
            # DSN z opcjonalnego Secretu (tools/k3s/secrets.sh); bez GlitchTipa pusty -> SDK wyłączone.
            - name: SENTRY_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_SEARCH, optional: true } }
            # `env` wygrywa z `envFrom`: ConfigMap ma APP_ENV=production
            # (konwencja Laravela), Symfony chce `prod`.
            - name: APP_ENV
              value: prod
            - name: APP_SECRET
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: SEARCH_APP_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: DATABASE_URL } }
            - name: MESSENGER_TRANSPORT_DSN
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: MESSENGER_TRANSPORT_DSN } }
            - name: ELASTICSEARCH_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: ES_SEARCHSVC_USER } }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: ES_SEARCHSVC_PASSWORD } }
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f messenger:consume"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
# ============================================================================
#  search-metrics (ETAP G1) — odpowiednik usługi `search-metrics` z Compose.
#  search nie ma HTTP, więc /metrics (MetricsController) serwuje ten sam obraz
#  uruchomiony jako `frankenphp php-server`. Osobny Deployment, NIE sidecar
#  konsumenta: metryki opisują kolejkę i bazę, nie proces konsumenta — nie
#  chcemy, żeby restart konsumenta gasił metryki (i na odwrót).
#  Bez etykiety `app: search-consumer` na Deploymencie: deploy.sh wdraża go
#  razem z catalogiem (OTHER_APPS_SEL), bo tylko czyta.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: search-metrics
  labels:
    app.kubernetes.io/component: app
    app: search-metrics
spec:
  selector:
    app: search-metrics
  ports:
    - name: metrics
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-metrics
  labels:
    app.kubernetes.io/component: app
    app: search-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-metrics
  template:
    metadata:
      labels:
        app: search-metrics
    spec:
      serviceAccountName: search
      automountServiceAccountToken: false
      # Jak search-consumer; do tego Caddy (frankenphp php-server) pisze w /data i /config.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33      # www-data (obraz FrankenPHP); pliki /app należą do roota i są czytelne dla wszystkich
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
        # Port 80 bez roota: z allowPrivilegeEscalation: false (no_new_privs) jądro NIE
        # nadaje capability z pliku frankenphp (catalog.yaml) — exec przechodzi, ale bind(:80) dostaje
        # „permission denied” (RUNBOOK #086). Sysctl z listy „bezpiecznych” (k8s 1.22+,
        # dozwolony w profilu restricted) obniża próg portów uprzywilejowanych w sieci
        # TEGO poda. containerd 2.x ustawia to domyślnie — tu jawnie, żeby nie zależeć od runtime'u.
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      containers:
        - name: metrics
          image: ghcr.io/dommmin/elastic-search:placeholder
          command: ["frankenphp", "php-server", "--root", "/app/public", "--listen", ":80"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # frankenphp ma file capability cap_net_bind_service (komentarz w catalog.yaml).
              add: [NET_BIND_SERVICE]
          envFrom:
            - configMapRef:
                name: marketplace-config
          env:
            - name: ERROR_TRACKING_PROCESS
              value: metrics
            - name: SENTRY_DSN
              valueFrom: { secretKeyRef: { name: glitchtip-secrets, key: DSN_SEARCH, optional: true } }
            - name: APP_ENV
              value: prod
            - name: APP_SECRET
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: SEARCH_APP_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: DATABASE_URL } }
            - name: MESSENGER_TRANSPORT_DSN
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: MESSENGER_TRANSPORT_DSN } }
            - name: ELASTICSEARCH_USER
              valueFrom: { configMapKeyRef: { name: marketplace-config, key: ES_SEARCHSVC_USER } }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: marketplace-secrets, key: ES_SEARCHSVC_PASSWORD } }
          ports:
            - name: metrics
              containerPort: 80
          # Endpoint zwraca 200 także przy błędzie odczytu (search_metrics_scrape_error 1,
          # patrz MetricsController) — sonda sprawdza więc proces i HTTP, nie zależności.
          readinessProbe:
            httpGet: { path: /metrics, port: 80 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: 80 }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { memory: 48Mi, cpu: 20m }
            limits: { memory: 192Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: caddy-data, emptyDir: {} }
        - { name: caddy-config, emptyDir: {} }
