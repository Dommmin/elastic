# ============================================================================
#  Role aplikacji w Elasticsearchu (ETAP D2) — przeniesione 1:1 z
#  infra/elasticsearch/setup-security.sh (D1 tworzył je przez API).
#  ECK wgrywa je jako file realm roles: zmiana tego pliku + apply = nowe
#  uprawnienia, bez ręcznego curl-a.
# ============================================================================

# D-03: Laravel nigdy nie pisze do Elasticsearcha. Ta rola to egzekwuje.
catalog_app:
  cluster: ["monitor"]
  indices:
    - names: ["products-*", "offers-*", "seller-360*", "search-stats-*"]
      privileges: ["read", "view_index_metadata"]

# Jedyny serwis, który pisze do ES; zarządza też szablonami i ILM,
# bo mapowania są kodem (01-INFRASTRUKTURA.md). cancel_task: Ctrl-C w
# `search:index:migrate reindex --wait` anuluje zadanie _reindex (ETAP 10).
# manage_transform, manage_enrich, product-popularity*: popularność (ETAP 12) —
# `search:popularity:refresh` przebudowuje transform i wykonuje politykę enrich.
# ETAP 13: complaints* — import reklamacji (complaints, complaints-unmatched, _reindex, delete-by-query);
# manage_enrich wykonuje też politykę seller-by-nip.
# ETAP 13b: courier-ratings (jawna nazwa) — oceny kurierów; fan-out `_update_by_query` na seller-360* mieści się w "all".
search_service:
  cluster: ["monitor", "manage_index_templates", "manage_ilm", "manage_pipeline", "cancel_task", "manage_transform", "manage_enrich"]
  indices:
    - names: ["products-*", "offers-*", "seller-360*", "alerts-*", "events-*", "search-stats-*", "seller-sales-*", "logs-app-*", "product-popularity*", "complaints*"]
      privileges: ["all"]
    - names: ["courier-ratings"]
      privileges: ["read", "write", "view_index_metadata"]

# ETAP 13 (Task 15): widok sprzedawcy. Basic nie ma FLS/DLS, więc izolacja to osobny alias
# `seller-360-public` (bez billing i complaints) i rola z `read` tylko na nim.
seller_stats_view:
  cluster: []
  indices:
    - names: ["seller-360-public"]
      privileges: ["read"]
